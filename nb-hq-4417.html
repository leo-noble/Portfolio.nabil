<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nabil Uddin</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#06070a; --ink:#eceef2; --ink-dim:#8c93a3; --ink-faint:#52586a;
  --line: rgba(255,255,255,0.09); --line-h: rgba(255,255,255,0.16);
  --accent:#cdb27e; --accent-soft: rgba(205,178,126,0.10);
  --surf: rgba(255,255,255,0.03); --surf-h: rgba(255,255,255,0.06);
  --danger:#d97b6c; --danger-soft: rgba(217,123,108,0.12);
  --fD:'Fraunces',serif; --fB:'Inter',sans-serif;
  --ease: cubic-bezier(.16,1,.3,1); --t:.25s var(--ease);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--fB);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100vh;}
a{color:inherit;}
::selection{background:var(--accent-soft);}

/* ── LOGIN SCREEN ── */
#loginView{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.login-card{
  width:100%;max-width:360px;background:var(--surf);border:1px solid var(--line);
  border-radius:20px;padding:36px 30px;
}
.login-card h1{font-family:var(--fD);font-weight:500;font-size:22px;margin-bottom:6px;}
.login-card p{color:var(--ink-dim);font-size:13.5px;margin-bottom:26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px;letter-spacing:.01em;}
.field input, .field textarea, .field select{
  width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;color:var(--ink);font-family:var(--fB);font-size:14px;
  transition:border-color var(--t),background var(--t);
}
.field input:focus, .field textarea:focus, .field select:focus{
  outline:none;border-color:var(--accent);background:rgba(255,255,255,0.045);
}
.field textarea{resize:vertical;min-height:64px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:10px;border:1px solid var(--line-h);
  background:var(--surf-h);color:var(--ink);font-family:var(--fB);font-size:13.5px;font-weight:500;
  cursor:pointer;transition:background var(--t),border-color var(--t),transform var(--t);
}
.btn:hover{background:rgba(255,255,255,0.09);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#1c1508;font-weight:600;}
.btn-primary:hover{background:#dbc18f;}
.btn-danger{background:var(--danger-soft);border-color:rgba(217,123,108,0.3);color:var(--danger);}
.btn-danger:hover{background:rgba(217,123,108,0.2);}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
#loginErr{color:var(--danger);font-size:13px;margin-top:12px;display:none;}

/* ── DASHBOARD ── */
#dashView{display:none;max-width:840px;margin:0 auto;padding:40px 24px 100px;}
.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px;gap:16px;flex-wrap:wrap;}
.top-row h1{font-family:var(--fD);font-weight:500;font-size:24px;}
.top-row .sub{color:var(--ink-dim);font-size:13.5px;margin-top:4px;}

.panel{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:26px 24px;margin-bottom:22px;}
.panel h2{font-family:var(--fD);font-weight:500;font-size:17px;margin-bottom:4px;}
.panel .hint{color:var(--ink-faint);font-size:12.5px;margin-bottom:18px;}

/* profile */
.profile-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.av-preview{width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--line-h);background:var(--surf-h);flex-shrink:0;}
.profile-fields{flex:1;min-width:220px;display:flex;flex-direction:column;gap:12px;}

/* project cards list */
.proj-item{
  border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;
  background:rgba(255,255,255,0.015);
}
.proj-item-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.proj-ico-preview{width:34px;height:34px;border-radius:9px;overflow:hidden;flex-shrink:0;background:var(--surf-h);}
.proj-ico-preview svg{width:100%;height:100%;}
.proj-item-head .name{font-weight:600;font-size:14.5px;flex:1;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr;}}
.proj-actions{display:flex;gap:10px;margin-top:14px;justify-content:flex-end;}

.add-row{display:flex;justify-content:center;margin-top:6px;}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#161822;border:1px solid var(--line-h);color:var(--ink);
  padding:11px 20px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:opacity var(--t),transform var(--t);z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{border-color:rgba(217,123,108,0.4);color:var(--danger);}

.logout-link{color:var(--ink-faint);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:var(--ink);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="loginView">
  <div class="login-card">
    <h1>Admin</h1>
    <p>Sign in to manage your portfolio.</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" autocomplete="username" placeholder="you@example.com"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••"/>
    </div>
    <button class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
    <p id="loginErr"></p>
  </div>
</div>

<div id="dashView">
  <div class="top-row">
    <div>
      <h1>Portfolio Admin</h1>
      <div class="sub">Changes go live on your site immediately.</div>
    </div>
    <span class="logout-link" id="logoutBtn">Log out</span>
  </div>

  <div class="panel">
    <h2>Profile photo</h2>
    <p class="hint">This replaces the photo in your hero section.</p>
    <div class="profile-row">
      <img class="av-preview" id="avPreview" src="" alt=""/>
      <div class="profile-fields">
        <input type="file" id="avFile" accept="image/*"/>
        <button class="btn" id="avUploadBtn">Upload &amp; save</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Projects</h2>
    <p class="hint">Add, edit, reorder, or remove the project cards on your site.</p>
    <div id="projList"></div>
    <div class="add-row">
      <button class="btn" id="addProjBtn">+ Add project</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://vlapseizgtdvektmfkkg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsYXBzZWl6Z3RkdmVrdG1ma2tnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMDI0MjQsImV4cCI6MjEwMDc3ODQyNH0.CGX1vVAt31q9ONuz9Tmderf34PKS_pXUEYIXn626IH8';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginView = document.getElementById('loginView');
const dashView = document.getElementById('dashView');
const toastEl = document.getElementById('toast');

function toast(msg, isErr=false){
  toastEl.textContent = msg;
  toastEl.classList.toggle('err', isErr);
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), 2600);
}

/* ── AUTH ── */
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display='none';
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Sign in';
  if(error){
    errEl.textContent = 'Incorrect email or password.';
    errEl.style.display = 'block';
    return;
  }
  showDashboard();
}

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await supabase.auth.signOut();
  location.reload();
});

async function checkSession(){
  const { data: { session } } = await supabase.auth.getSession();
  if(session) showDashboard();
}

function showDashboard(){
  loginView.style.display = 'none';
  dashView.style.display = 'block';
  loadProfile();
  loadProjects();
}

checkSession();

/* ── PROFILE ── */
async function loadProfile(){
  const { data } = await supabase.from('profile').select('*').eq('id',1).single();
  if(data && data.image_url){
    document.getElementById('avPreview').src = data.image_url;
  }
}

document.getElementById('avUploadBtn').addEventListener('click', async ()=>{
  const fileInput = document.getElementById('avFile');
  const file = fileInput.files[0];
  if(!file){ toast('Choose an image first', true); return; }
  const btn = document.getElementById('avUploadBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try{
    const ext = file.name.split('.').pop();
    const path = `profile-${Date.now()}.${ext}`;
    const { error: upErr } = await supabase.storage.from('portfolio-assets').upload(path, file, { upsert:true });
    if(upErr) throw upErr;
    const { data: pub } = supabase.storage.from('portfolio-assets').getPublicUrl(path);
    const { error: dbErr } = await supabase.from('profile').update({ image_url: pub.publicUrl, updated_at: new Date().toISOString() }).eq('id',1);
    if(dbErr) throw dbErr;
    document.getElementById('avPreview').src = pub.publicUrl;
    toast('Profile photo updated');
  }catch(e){
    toast(e.message || 'Upload failed', true);
  }finally{
    btn.disabled = false; btn.textContent = 'Upload & save';
  }
});

/* ── PROJECTS ── */
let projects = [];

async function loadProjects(){
  const { data, error } = await supabase.from('projects').select('*').order('sort_order',{ascending:true});
  if(error){ toast(error.message, true); return; }
  projects = data || [];
  renderProjects();
}

function renderProjects(){
  const list = document.getElementById('projList');
  list.innerHTML = '';
  projects.forEach(p=>{
    const item = document.createElement('div');
    item.className = 'proj-item';
    item.innerHTML = `
      <div class="proj-item-head">
        <div class="proj-ico-preview">${p.logo_svg || ''}</div>
        <div class="name">${escapeHtml(p.title) || 'Untitled'}</div>
      </div>
      <div class="grid2">
        <div class="field"><label>Title</label><input class="f-title" value="${attr(p.title)}"/></div>
        <div class="field"><label>Link (URL)</label><input class="f-url" value="${attr(p.url)}"/></div>
      </div>
      <div class="field"><label>Description</label><textarea class="f-desc">${escapeHtml(p.description||'')}</textarea></div>
      <div class="grid3">
        <div class="field"><label>Status</label>
          <select class="f-status">
            <option value="live" ${p.status==='live'?'selected':''}>Live</option>
            <option value="beta" ${p.status==='beta'?'selected':''}>Beta</option>
            <option value="none" ${p.status==='none'?'selected':''}>No badge</option>
          </select>
        </div>
        <div class="field"><label>Card color</label>
          <select class="f-theme">
            <option value="violet" ${p.theme==='violet'?'selected':''}>Violet</option>
            <option value="teal" ${p.theme==='teal'?'selected':''}>Teal</option>
          </select>
        </div>
        <div class="field"><label>Order</label><input class="f-order" type="number" value="${p.sort_order ?? 0}"/></div>
      </div>
      <div class="field"><label>Logo (SVG code, or leave as-is)</label><textarea class="f-svg" style="font-family:monospace;font-size:12px;min-height:80px;">${escapeHtml(p.logo_svg||'')}</textarea></div>
      <div class="proj-actions">
        <button class="btn btn-danger f-delete">Delete</button>
        <button class="btn btn-primary f-save">Save changes</button>
      </div>
    `;
    item.querySelector('.f-save').addEventListener('click', ()=>saveProject(p.id, item));
    item.querySelector('.f-delete').addEventListener('click', ()=>deleteProject(p.id));
    item.querySelector('.f-svg').addEventListener('input', e=>{
      item.querySelector('.proj-ico-preview').innerHTML = e.target.value;
    });
    list.appendChild(item);
  });
}

async function saveProject(id, item){
  const btn = item.querySelector('.f-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  const payload = {
    title: item.querySelector('.f-title').value.trim(),
    url: item.querySelector('.f-url').value.trim(),
    description: item.querySelector('.f-desc').value.trim(),
    status: item.querySelector('.f-status').value,
    theme: item.querySelector('.f-theme').value,
    sort_order: parseInt(item.querySelector('.f-order').value,10) || 0,
    logo_svg: item.querySelector('.f-svg').value,
  };
  const { error } = await supabase.from('projects').update(payload).eq('id', id);
  btn.disabled = false; btn.textContent = 'Save changes';
  if(error){ toast(error.message, true); return; }
  toast('Project saved');
  loadProjects();
}

async function deleteProject(id){
  if(!confirm('Delete this project? This can\'t be undone.')) return;
  const { error } = await supabase.from('projects').delete().eq('id', id);
  if(error){ toast(error.message, true); return; }
  toast('Project deleted');
  loadProjects();
}

document.getElementById('addProjBtn').addEventListener('click', async ()=>{
  const maxOrder = projects.reduce((m,p)=>Math.max(m,p.sort_order||0), 0);
  const { error } = await supabase.from('projects').insert({
    title: 'New project',
    description: 'Describe your project here.',
    url: 'https://example.com',
    logo_svg: '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="40" rx="10" fill="#3E3A8C"/></svg>',
    theme: 'violet',
    status: 'live',
    sort_order: maxOrder + 1
  });
  if(error){ toast(error.message, true); return; }
  toast('Project added — edit it below');
  loadProjects();
});

function escapeHtml(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function attr(s){ return (s||'').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
